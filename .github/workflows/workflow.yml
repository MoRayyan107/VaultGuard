name: VaultGuard CI

permissions:
  contents: read

env:
  CI: true
  MAVEN_OPTS: "-Xmx2048m -XX:+UseG1GC"

on:
  push:
    branches:
      - main
      - master
      - "features/**"
      - "fixes/**"
      - "feature/**"
      - "fix/**"
      - "tests/**"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: vaultguard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker status
        run: |
          docker info

      - name: Test and package backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and build frontend
        run: |
          npm run lint
          npm run build
